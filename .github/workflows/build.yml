name: Build Sapphire APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build phone + watch
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleRelease :wear:assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir out
          cp mobile/build/outputs/apk/release/*.apk out/Sapphire-phone.apk
          cp wear/build/outputs/apk/release/*.apk out/Sapphire-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sapphire
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sapphire ${{ github.run_number }}
          files: out/*.apk
